[package]
name = "cassandra-rust-client"
version = "0.1.0"
edition = "2021"
authors = ["maning07"]

[dependencies]
# Cassandra driver
scylla = "0.11"
# Async runtime
tokio = { version = "1.35", features = ["full"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Connection pool and retry
async-trait = "0.1"
futures = "0.3"
# UUID support
uuid = { version = "1.6", features = ["serde", "v4"] }

[dev-dependencies]
mockall = "0.12"
